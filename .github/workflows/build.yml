name: Build NRO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jugeeya/cargo-skyline:2.1.0

    steps:
      - uses: actions/checkout@v4

      - name: Build release NRO
        run: PATH=$PATH:/root/.cargo/bin /root/.cargo/bin/cargo-skyline skyline build --release
        env:
          HOME: /root

      - name: Locate NRO
        run: find target/aarch64-skyline-switch/release -maxdepth 1 -name '*.nro' -print

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: bayonetta-body-glow-nro
          path: target/aarch64-skyline-switch/release/libbayonetta_body_glow.nro
          if-no-files-found: error
