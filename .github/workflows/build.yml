name: Build NRO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-skyline
        run: |
          cargo install --git https://github.com/jam1garner/cargo-skyline --force
          cargo-skyline skyline update-std

      - name: Build release NRO
        run: cargo-skyline skyline build --release

      - name: Locate NRO
        run: find target/aarch64-skyline-switch/release -maxdepth 1 -name '*.nro' -print

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: bayonetta-body-glow-nro
          path: target/aarch64-skyline-switch/release/libbayonetta_body_glow.nro
          if-no-files-found: error
